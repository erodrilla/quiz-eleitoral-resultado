<script>
        // CONFIGURE SUAS CHAVES DO SUPABASE AQUI
        const SUPABASE_URL = "https://hglifytalonmncphycfp.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhnbGlmeXRhbG9ubW5jcGh5Y2ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2OTM3MTksImV4cCI6MjEwMTI2OTcxOX0.gFB1qB_n6qXcmVOAj-UyEKqwj4J4oylpK_w0s_cZcVQ";
        
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function buscarResultado() {
            const params = new URLSearchParams(window.location.search);
            const sessaoId = params.get('sessao') || params.get('id_sessao') || params.get('id');

            if (!sessaoId) {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('erro').classList.remove('hidden');
                return;
            }

            const resposta = await supabase
                .from('resultados_quiz')
                .select('*')
                .eq('id', sessaoId)
                .single();

            document.getElementById('loading').classList.add('hidden');

            if (resposta.error || !resposta.data) {
                document.getElementById('erro').classList.remove('hidden');
                return;
            }

            const item = resposta.data;

            // Preenche os dados na tela
            document.getElementById('nome').innerText = item.nome_candidato || "Candidato";
            document.getElementById('partido').innerText = item.partido || "";
            document.getElementById('numero').innerText = "Número: " + (item.numero_candidato || "");
            document.getElementById('justificativa').innerText = item.justificativa || "Nenhuma justificativa informada.";
            
            if (item.foto) {
                document.getElementById('foto').src = item.foto;
            }

            document.getElementById('resultado').classList.remove('hidden');
        }

        buscarResultado();
    </script>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultado do Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">
  <div id="app" class="bg-white shadow-xl rounded-2xl p-6 max-w-md w-full text-center border border-slate-100">
    <div id="loading" class="py-12 text-slate-500">Carregando resultado...</div>
    <div id="resultado" class="hidden"></div>
    <div id="erro" class="hidden py-8 text-red-500 font-semibold"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://hglifytalonmncphycfp.supabase.co';
    const SUPABASE_ANON_KEY = eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9."eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhnbGlmeXRhbG9ubW5jcGh5Y2ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2OTM3MTksImV4cCI6MjEwMTI2OTcxOX0.gFB1qB_n6qXcmVOAj-UyEKqwj4J4oylpK_w0s_cZcVQ";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const $ = (id) => document.getElementById(id);
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    }[char]));

    async function buscarResultado() {
      const params = new URLSearchParams(window.location.search);
      const sessaoId = (params.get('sessao') || params.get('id') || '').trim();

      if (!sessaoId) {
        exibirErro('Identificador da sessão ausente na URL.');
        return;
      }

      try {
        // Se resultados_quiz estiver no schema public, remova .schema('eleicoes_2026').
        const { data, error } = await db
          .schema('eleicoes_2026')
          .from('resultados_quiz')
          .select('*')
          .eq('id_sessao', sessaoId)
          .order('created_at', { ascending: false })
          .limit(1)
          .maybeSingle();

        $('loading').classList.add('hidden');

        if (error) {
          console.error('Erro ao consultar resultados_quiz:', error);
          exibirErro('Não foi possível consultar o resultado. Tente novamente em instantes.');
          return;
        }

        if (!data) {
          exibirErro('Sessão ainda não encontrada. Tente novamente em instantes.');
          return;
        }

        const bloqueado = data.bloquear_candidatos === true ||
          String(data.bloquear_candidatos).toLowerCase() === 'true' ||
          data.status === 'bloqueado_contrarios' ||
          Number(data.contrarios ?? data.total_contrarios ?? 0) >= 3;

        if (bloqueado) {
          renderizarBloqueio(data);
          return;
        }

        const status = String(data.status || '').toLowerCase();
        const nome = data.nome_candidato || data.candidato_nome;

        if (['processando', 'processando_indicacao', 'pendente'].includes(status) || !nome) {
          renderizarProcessando();
          return;
        }

        renderizarCandidato(data);
      } catch (err) {
        console.error(err);
        $('loading').classList.add('hidden');
        exibirErro('Erro inesperado ao carregar o resultado.');
      }
    }

    function exibirErro(mensagem) {
      $('erro').textContent = mensagem;
      $('erro').classList.remove('hidden');
    }

    function renderizarProcessando() {
      $('resultado').innerHTML = '<p class="py-8 text-slate-600">Estamos processando suas respostas. Atualize esta página em alguns instantes.</p>';
      $('resultado').classList.remove('hidden');
    }

    function renderizarBloqueio(data) {
      $('resultado').innerHTML = `
        <div class="flex flex-col items-center text-left">
          <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mb-3 mx-auto">!</div>
          <h2 class="text-lg font-bold text-slate-800 text-center mb-2">Orientações de Consulta</h2>
          <p class="text-sm text-slate-600 leading-relaxed mb-4 text-center">${escapeHtml(data.mensagem || 'Recomendamos consultar plataformas independentes para pesquisar propostas e histórico de atuação.')}</p>
          <div class="flex flex-col gap-2 w-full">
            <a href="https://quemfoiquem.org.br/lp6/" target="_blank" rel="noopener noreferrer" class="bg-indigo-600 text-white text-sm font-semibold py-2.5 px-4 rounded-xl text-center">Quem Foi Quem</a>
            <a href="https://www.agencialupa.org/deputometro/" target="_blank" rel="noopener noreferrer" class="bg-slate-800 text-white text-sm font-semibold py-2.5 px-4 rounded-xl text-center">Agência Lupa — Deputômetro</a>
          </div>
        </div>`;
      $('resultado').classList.remove('hidden');
    }

    function renderizarCandidato(c) {
      $('resultado').innerHTML = `
        <div class="flex flex-col items-center">
          <img src="${escapeHtml(c.foto || 'https://via.placeholder.com/150')}" class="w-32 h-32 rounded-full object-cover shadow-md mb-4 border-4 border-slate-50" alt="Foto do candidato">
          <h2 class="text-xl font-bold text-slate-800 uppercase mb-1">${escapeHtml(c.nome_candidato || c.candidato_nome)}</h2>
          <p class="text-lg font-semibold text-indigo-600 mb-2">${escapeHtml(c.partido)}</p>
          <div class="bg-indigo-50/50 border border-indigo-100 rounded-xl p-4 text-left w-full">
            <h3 class="text-xs font-bold text-indigo-900 uppercase tracking-wider mb-1">Por que este candidato?</h3>
            <p class="text-sm text-slate-600 leading-relaxed">${escapeHtml(c.justificativa || c.justificativafinal)}</p>
          </div>
        </div>`;
      $('resultado').classList.remove('hidden');
    }

    buscarResultado();
  </script>
</body>
</html>

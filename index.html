<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado do Quiz Eleitoral</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">

    <div id="app" class="bg-white shadow-xl rounded-2xl p-6 max-w-md w-full text-center border border-slate-100">
        <div id="loading" class="py-12 text-slate-500">
            Carregando seu resultado...
        </div>
        
        <div id="resultado" class="hidden">
            <!-- Os dados do candidato serão injetados aqui via JavaScript -->
        </div>

        <div id="erro" class="hidden py-8 text-red-500">
            Candidato não identificado ou sessão inválida.
        </div>
    </div>

    <script>
        // Configuração do Supabase (Insira suas chaves públicas corretas)
        const SUPABASE_URL = 'https://hglifytalonmncphycfp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhnbGlmeXRhbG9ubW5jcGh5Y2ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2OTM3MTksImV4cCI6MjEwMTI2OTcxOX0.gFB1qB_n6qXcmVOAj-UyEKqwj4J4oylpK_w0s_cZcVQ';
        
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function buscarResultado() {
            const params = new URLSearchParams(window.location.search);
            const sessaoId = params.get('sessao') || params.get('id');

            if (!sessaoId) {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('erro').classList.remove('hidden');
                return;
            }

            try {
                // Consulta buscando pelo ID numérico padrão da tabela
                const { data, error } = await db
                    .from('resultados_quiz')
                    .select('*')
                    .eq('id', sessaoId)
                    .single();

                document.getElementById('loading').classList.add('hidden');

                if (error || !data) {
                    document.getElementById('erro').classList.remove('hidden');
                    return;
                }

                // Renderiza o card do candidato se encontrado
                const container = document.getElementById('resultado');
                container.classList.remove('hidden');
                
                container.innerHTML = `
                    <div class="flex flex-col items-center">
                        <img src="${data.foto || 'https://via.placeholder.com/150'}" alt="Foto do Candidato" class="w-32 h-32 rounded-full object-cover shadow-md mb-4 border-4 border-slate-50">
                        <h2 class="text-xl font-bold text-slate-800 uppercase mb-1">${data.nome_candidato || 'Nome não informado'}</h2>
                        <p class="text-lg font-semibold text-indigo-600 mb-2">${data.partido || 'Partido'}</p>
                        <span class="bg-slate-100 text-slate-600 text-sm px-3 py-1 rounded-full font-medium mb-6">Número: ${data.numero || '----'}</span>
                        
                        <div class="bg-indigo-50/50 border border-indigo-100 rounded-xl p-4 text-left w-full">
                            <h3 class="text-xs font-bold text-indigo-900 uppercase tracking-wider mb-1">Por que este candidato?</h3>
                            <p class="text-sm text-slate-600 leading-relaxed">${data.justificativa || 'Com base nas suas respostas, este candidato é o que melhor se alinha aos seus valores.'}</p>
                        </div>
                    </div>
                `;

            } catch (err) {
                console.error(err);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('erro').classList.remove('hidden');
            }
        }

        buscarResultado();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seu Candidato — Quiz Eleitoral SP</title>
  <meta property="og:title" content="Descubra seu candidato no Quiz Eleitoral SP" />
  <meta property="og:type" content="website" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0a1628 0%, #1e3a5f 100%);
      min-height: 100vh;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #conteudo {
      max-width: 600px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .foto {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 24px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .score-badge {
      display: inline-block;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      padding: 8px 20px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .partido {
      font-size: 16px;
      color: #94a3b8;
      margin-bottom: 24px;
      font-weight: 500;
    }

    .justificativa {
      background: rgba(255, 255, 255, 0.08);
      padding: 20px;
      border-radius: 16px;
      font-size: 16px;
      line-height: 1.6;
      text-align: left;
      margin-bottom: 28px;
      border-left: 4px solid #10b981;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      margin: 6px;
      cursor: pointer;
      border: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3); }

    .btn-instagram {
      background: linear-gradient(135deg, #833ab4 0%, #fd1d1d 50%, #fcb045 100%);
      color: #fff;
    }

    .btn-compartilhar {
      background: #fff;
      color: #0a1628;
    }

    .erro {
      color: #fca5a5;
      font-size: 16px;
      padding: 20px;
    }

    .loading {
      color: #94a3b8;
      font-size: 16px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div id="conteudo">
    <p class="loading">Carregando seu resultado...</p>
  </div>

  <script>
    const SUPABASE_URL = 'https://hglifytalonmncphycfp.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhnbGlmeXRhbG9ubW5jcGh5Y2ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2OTM3MTksImV4cCI6MjEwMTI2OTcxOX0.gFB1qB_n6qXcmVOAj-UyEKqwj4J4oylpK_w0s_cZcVQ';

    async function buscarResultado(sessao) {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/eleitores_respostas?id_sessao=eq.${encodeURIComponent(sessao)}&select=id_sessao,nome_candidato,partido,pontuacao_afinidade,candidato_recomendado`,
        {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          }
        }
      );
      const data = await res.json();
      return Array.isArray(data) && data.length > 0 ? data[0] : null;
    }

    async function buscarFoto(nome) {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/candidatos?select=Foto,Instagram&"Nome_Urna"=eq.${encodeURIComponent(nome)}`,
        {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          }
        }
      );
      const data = await res.json();
      return Array.isArray(data) && data.length > 0 ? data[0] : null;
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const sessao = params.get('sessao');

      if (!sessao) {
        document.getElementById('conteudo').innerHTML =
          '<p class="erro">Link inválido. Nenhuma sessão encontrada.</p>';
        return;
      }

      // Tenta até 10x com intervalo de 2s (aguarda Edge Function processar)
      let resultado = null;
      for (let i = 0; i < 10; i++) {
        resultado = await buscarResultado(sessao);
        if (resultado) break;
        await new Promise(r => setTimeout(r, 2000));
      }

      if (!resultado) {
        document.getElementById('conteudo').innerHTML =
          '<p class="erro">Resultado não encontrado. Tente responder o quiz novamente.</p>';
        return;
      }

      const candidato = await buscarFoto(resultado.nome_candidato);

      const foto = candidato?.Foto
        ? `<img class="foto" src="${candidato.Foto}" alt="${escapeHtml(resultado.nome_candidato)}" />`
        : '';

      const instagram = candidato?.Instagram
        ? `<a class="btn btn-instagram" href="${candidato.Instagram}" target="_blank" rel="noopener noreferrer">📸 Ver Instagram</a>`
        : '';

      document.getElementById('conteudo').innerHTML = `
        ${foto}
        <div class="score-badge">⚡ ${Number(resultado.pontuacao_afinidade).toFixed(1)}% de afinidade</div>
        <h1>${escapeHtml(resultado.nome_candidato)}</h1>
        <p class="partido">${escapeHtml(resultado.partido ?? '')}</p>
        <div class="justificativa">${escapeHtml(resultado.candidato_recomendado)}</div>
        ${instagram}
        <button class="btn btn-compartilhar" onclick="compartilhar()">🔗 Compartilhar resultado</button>
      `;
    }

    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function compartilhar() {
      const url = window.location.href;
      if (navigator.share) {
        navigator.share({
          title: 'Meu candidato no Quiz Eleitoral SP',
          text: 'Descubra o seu também!',
          url,
        }).catch(() => {
          navigator.clipboard.writeText(url);
          alert('Link copiado!');
        });
      } else {
        navigator.clipboard.writeText(url);
        alert('Link copiado!');
      }
    }

    init();
  </script>
</body>
</html>

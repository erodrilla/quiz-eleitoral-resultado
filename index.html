<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado do Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">

    <div id="app" class="bg-white shadow-xl rounded-2xl p-6 max-w-md w-full text-center border border-slate-100">
        <div id="loading" class="py-12 text-slate-500">Carregando resultado...</div>
        <div id="resultado" class="hidden"></div>
        <div id="erro" class="hidden py-8 text-red-500 font-semibold">Dados não encontrados. Tente novamente.</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://hglifytalonmncphycfp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhnbGlmeXRhbG9ubW5jcGh5Y2ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2OTM3MTksImV4cCI6MjEwMTI2OTcxOX0.gFB1qB_n6qXcmVOAj-UyEKqwj4J4oylpK_w0s_cZcVQ';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function buscarResultado() {
            const params = new URLSearchParams(window.location.search);
            const sessaoId = params.get('sessao') || params.get('id');

            if (!sessaoId) {
                exibirErro();
                return;
            }

            try {
                const { data, error } = await db
                    .from('resultados_quiz')
                    .select('*')
                    .eq('id_sessao', sessaoId)
                    .order('created_at', { ascending: false });

                if (error || !data || data.length === 0) {
                    exibirErro();
                    return;
                }

                const candidato = data[0];
                document.getElementById('loading').classList.add('hidden');

                // Verifica se o flag de bloqueio está presente e verdadeiro
                if (candidato.bloquear_candidatos === true || String(candidato.bloquear_candidatos) === 'true') {
                    renderizarBloqueio();
                } else if (candidato.nome_candidato) {
                    renderizarCandidato(candidato);
                } else {
                    exibirErro();
                }
            } catch (err) {
                exibirErro();
            }
        }

        function exibirErro() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('erro').classList.remove('hidden');
        }

        function renderizarBloqueio() {
            const container = document.getElementById('resultado');
            container.classList.remove('hidden');
            container.innerHTML = `
                <div class="space-y-4">
                    <h2 class="text-xl font-bold text-slate-800">Orientações de Consulta</h2>
                    <p class="text-sm text-slate-600">Para uma análise aprofundada, utilize plataformas independentes:</p>
                    <a href="https://quemfoiquem.org.br/?p=4" class="block bg-indigo-600 text-white py-2 rounded-lg">Quem Foi Quem</a>
                    <a href="https://www.agencialupa.org/deputometro/" class="block bg-slate-800 text-white py-2 rounded-lg">Agência Lupa</a>
                </div>`;
        }

        function renderizarCandidato(c) {
            const container = document.getElementById('resultado');
            container.classList.remove('hidden');
            container.innerHTML = `
                <img src="${c.foto || 'https://via.placeholder.com/150'}" class="w-24 h-24 rounded-full mx-auto mb-4 border-4 border-slate-50">
                <h2 class="text-lg font-bold uppercase">${c.nome_candidato}</h2>
                <p class="text-indigo-600 font-semibold">${c.partido || ''}</p>
                <div class="mt-4 bg-slate-50 p-3 rounded-lg text-sm text-slate-600">${c.justificativa || ''}</div>
            `;
        }

        buscarResultado();
    </script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recomendação de Candidato</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --brand: #0f766e;
      --brand2: #2563eb;
      --brand3: #7c3aed;
      --danger: #b91c1c;
      --shadow: 0 10px 30px rgba(0,0,0,.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
      color: var(--text);
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 16px 48px;
    }

    .hero {
      background: linear-gradient(135deg, #0f766e 0%, #155e75 100%);
      color: #fff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(26px, 3vw, 40px);
      line-height: 1.1;
    }

    .hero p {
      margin: 0;
      max-width: 760px;
      color: rgba(255,255,255,.9);
      line-height: 1.5;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .sliderBox {
      background: #f9fafb;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
    }

    .sliderHead {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 8px;
    }

    .sliderVal {
      font-weight: 700;
      color: var(--brand);
      min-width: 28px;
      text-align: right;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--brand);
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
      align-items: center;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 18px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .08s ease, opacity .2s ease, box-shadow .2s ease;
      box-shadow: 0 8px 20px rgba(15,118,110,.18);
    }

    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: .65; cursor: not-allowed; transform: none; }

    .btnPrimary {
      background: var(--brand);
      color: #fff;
    }

    .btnSecondary {
      background: #e5e7eb;
      color: #111827;
      box-shadow: none;
    }

    #status {
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .cardTop {
      position: relative;
      height: 240px;
      background: #f3f4f6;
    }

    .cardTop img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge {
      position: absolute;
      left: 14px;
      top: 14px;
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .2px;
    }

    .cardBody {
      padding: 16px;
    }

    .name {
      margin: 0 0 6px;
      font-size: 20px;
      line-height: 1.15;
    }

    .meta {
      color: var(--muted);
      margin-bottom: 12px;
      font-size: 14px;
    }

    .stats {
      display: grid;
      gap: 7px;
      font-size: 14px;
      line-height: 1.35;
    }

    .stats strong {
      color: #111827;
    }

    .link {
      display: inline-block;
      margin-top: 12px;
      color: var(--brand);
      text-decoration: none;
      font-weight: 700;
    }

    .gravame {
      margin-top: 12px;
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid #fecaca;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.4;
    }

    .empty {
      padding: 20px;
      color: var(--muted);
    }

    .errorBox {
      margin-top: 14px;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #fecaca;
      background: #fff1f2;
      color: #991b1b;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.5;
    }

    .footerNote {
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 640px) {
      .hero, .panel { padding: 16px; }
      .cardTop { height: 210px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>Encontre o candidato mais compatível</h1>
      <p>
        O eleitor responde ao questionário, o sistema calcula o match de perfil,
        filtra integridade e retorna o melhor candidato com 2 alternativas.
      </p>
    </section>

    <section class="panel">
      <div class="grid">
        <div class="sliderBox">
          <div class="sliderHead">
            <label for="mulheres">Mulheres & Gênero</label>
            <span class="sliderVal" id="valMulheres">5</span>
          </div>
          <input id="mulheres" type="range" min="0" max="10" value="5" />
        </div>

        <div class="sliderBox">
          <div class="sliderHead">
            <label for="educacao">Educação & Serv. Público</label>
            <span class="sliderVal" id="valEducacao">5</span>
          </div>
          <input id="educacao" type="range" min="0" max="10" value="5" />
        </div>

        <div class="sliderBox">
          <div class="sliderHead">
            <label for="meioAmbiente">Meio Ambiente</label>
            <span class="sliderVal" id="valMeioAmbiente">5</span>
          </div>
          <input id="meioAmbiente" type="range" min="0" max="10" value="5" />
        </div>

        <div class="sliderBox">
          <div class="sliderHead">
            <label for="impostos">Taxação sobre Renda/Fortunas</label>
            <span class="sliderVal" id="valImpostos">5</span>
          </div>
          <input id="impostos" type="range" min="0" max="10" value="5" />
        </div>

        <div class="sliderBox">
          <div class="sliderHead">
            <label for="direitos">Direitos Sociais</label>
            <span class="sliderVal" id="valDireitos">5</span>
          </div>
          <input id="direitos" type="range" min="0" max="10" value="5" />
        </div>

        <div class="sliderBox">
          <div class="sliderHead">
            <label for="seguranca">Segurança Pública</label>
            <span class="sliderVal" id="valSeguranca">5</span>
          </div>
          <input id="seguranca" type="range" min="0" max="10" value="5" />
        </div>

        <div class="sliderBox">
          <div class="sliderHead">
            <label for="transparencia">Transparência</label>
            <span class="sliderVal" id="valTransparencia">5</span>
          </div>
          <input id="transparencia" type="range" min="0" max="10" value="5" />
        </div>
      </div>

      <div class="actions">
        <button id="btnBuscar" class="btnPrimary">Encontrar top 3</button>
        <button id="btnResetar" class="btnSecondary" type="button">Resetar pesos</button>
      </div>

      <div id="status">Pronto para buscar.</div>
      <div class="footerNote">
        A ordem é: match de perfil → integridade → viabilidade → top 3.
      </div>

      <div id="erro" class="errorBox" style="display:none;"></div>
    </section>

    <section id="resultado" class="cards"></section>
  </div>

  <script>
    const SUPABASE_URL = "https://hglifytalonmncphycfp.supabase.co";
    const SUPABASE_ANON_KEY = "COLE_AQUI_SUA_ANON_KEY_REAL";

    const statusEl = document.getElementById("status");
    const erroEl = document.getElementById("erro");
    const resultadoEl = document.getElementById("resultado");
    const btnBuscar = document.getElementById("btnBuscar");
    const btnResetar = document.getElementById("btnResetar");

    const sliders = [
      ["mulheres", "valMulheres"],
      ["educacao", "valEducacao"],
      ["meioAmbiente", "valMeioAmbiente"],
      ["impostos", "valImpostos"],
      ["direitos", "valDireitos"],
      ["seguranca", "valSeguranca"],
      ["transparencia", "valTransparencia"]
    ];

    function fmtNumero(n) {
      if (n === null || n === undefined || n === "") return "-";
      return new Intl.NumberFormat("pt-BR").format(Number(n));
    }

    function fmtPct(n) {
      if (n === null || n === undefined || n === "") return "-";
      return `${(Number(n) * 100).toFixed(1)}%`;
    }

    function safeFoto(url) {
      if (url && String(url).trim()) return url;
      return "https://placehold.co/400x400/1e3a5f/ffffff?text=📸";
    }

    function syncLabels() {
      sliders.forEach(([id, labelId]) => {
        document.getElementById(labelId).textContent = document.getElementById(id).value;
      });
    }

    function getPesos() {
      return {
        p_mulheres: Number(document.getElementById("mulheres").value),
        p_educacao: Number(document.getElementById("educacao").value),
        p_meio_ambiente: Number(document.getElementById("meioAmbiente").value),
        p_impostos: Number(document.getElementById("impostos").value),
        p_direitos: Number(document.getElementById("direitos").value),
        p_seguranca: Number(document.getElementById("seguranca").value),
        p_transparencia: Number(document.getElementById("transparencia").value)
      };
    }

    function showError(message) {
      erroEl.style.display = "block";
      erroEl.textContent = message;
    }

    function clearError() {
      erroEl.style.display = "none";
      erroEl.textContent = "";
    }

    function renderCards(dados) {
      if (!dados.length) {
        resultadoEl.innerHTML = `<div class="empty">Nenhum candidato encontrado com os pesos atuais.</div>`;
        return;
      }

      resultadoEl.innerHTML = dados.map(item => {
        const tipo = item.tipo || "Recomendado";
        const cor = tipo === "Principal" ? "var(--brand)" : tipo === "Alternativa 1" ? "var(--brand2)" : "var(--brand3)";
        const titulo = item.nome_urna || item.nome_candidato || "-";
        const partido = item.partido || "-";
        const numero = item.numero_candidato || "-";

        return `
          <article class="card">
            <div class="cardTop">
              <img
                src="${safeFoto(item.foto)}"
                alt="${titulo}"
                onerror="this.src='https://placehold.co/400x400/1e3a5f/ffffff?text=📸'"
              />
              <div class="badge" style="background:${cor};">${tipo}</div>
            </div>

            <div class="cardBody">
              <h3 class="name">${titulo}</h3>
              <div class="meta">${partido} · Nº ${numero}</div>

              <div class="stats">
                <div><strong>Match de perfil:</strong> ${fmtPct(item.score_perfil)}</div>
                <div><strong>Integridade:</strong> ${item.status_integridade || "-"}</div>
                <div><strong>Viabilidade:</strong> ${item.status_viabilidade || "-"}</div>
                <div><strong>Votos:</strong> ${fmtNumero(item.total_votos)}</div>
                <div><strong>Seções:</strong> ${fmtNumero(item.secoes_com_voto)}</div>
                <div><strong>Zonas:</strong> ${fmtNumero(item.zonas_com_voto)}</div>
              </div>

              ${item.instagram ? `
                <a class="link" href="${item.instagram}" target="_blank" rel="noopener noreferrer">
                  Abrir Instagram
                </a>
              ` : ""}

              ${item.descricao_gravame ? `
                <div class="gravame">${item.descricao_gravame}</div>
              ` : ""}
            </div>
          </article>
        `;
      }).join("");
    }

    async function buscarTop3() {
      try {
        btnBuscar.disabled = true;
        statusEl.textContent = "Buscando candidatos...";
        clearError();
        resultadoEl.innerHTML = "";

        const payload = getPesos();

        const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/recomendar_top3_sp`, {
          method: "POST",
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const rawText = await res.text();

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}\n\n${rawText}`);
        }

        let dados;
        try {
          dados = JSON.parse(rawText);
        } catch (e) {
          throw new Error(`Resposta não veio em JSON válido:\n\n${rawText}`);
        }

        statusEl.textContent = `Encontrados ${dados.length} candidatos.`;
        renderCards(dados);

      } catch (err) {
        console.error(err);
        statusEl.textContent = "Erro ao buscar candidatos.";
        resultadoEl.innerHTML = `<div class="empty" style="color:#b91c1c;">Não foi possível carregar o top 3.</div>`;
        showError(String(err.message || err));
      } finally {
        btnBuscar.disabled = false;
      }
    }

    function resetarPesos() {
      sliders.forEach(([id, labelId]) => {
        const el = document.getElementById(id);
        el.value = 5;
        document.getElementById(labelId).textContent = "5";
      });
      clearError();
      statusEl.textContent = "Pesos resetados. Pronto para buscar.";
      resultadoEl.innerHTML = "";
    }

    sliders.forEach(([id, labelId]) => {
      const el = document.getElementById(id);
      el.addEventListener("input", () => {
        document.getElementById(labelId).textContent = el.value;
      });
    });

    btnBuscar.addEventListener("click", buscarTop3);
    btnResetar.addEventListener("click", resetarPesos);

    syncLabels();
  </script>
</body>
</html>
